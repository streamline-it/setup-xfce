  ansible.builtin.assert:
    that: 
      - setup_xfce_gui_users is defined
      - setup_xfce_gui_users is truthy
      - setup_xfce_pkgs is defined
      - setup_xfce_pkgs is truthy
      - setup_xfce_svcs is defined
      - setup_xfce_svcs is truthy
      - setup_xfce_sysrc_directives is defined
      - setup_xfce_sysrc_directives is truthy
      - setup_xfce_pixbuf_update_path is defined
      - setup_xfce_pixbuf_update_path is truthy
      - setup_xfce_mime_db_path is defined
      - setup_xfce_mime_db_path is truthy
      - setup_xfce_mime_data_path is defined
      - setup_xfce_mime_data_path is truthy
      - setup_xfce_mime_db_path is defined
      - setup_xfce_mime_db_path is truthy
      - setup_xfce_mime_data_path is defined
      - setup_xfce_mime_data_path is truthy
    fail_msg: >
      "Make sure the following variables are defined and values are step"
