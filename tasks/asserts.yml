---
- name: ensure needed variables are defined
  ansible.builtin.assert:
    that: 
      - setup_xfce_gui_users is defined
      - setup_xfce_pkgs is defined
      - setup_xfce_svcs is defined
      - setup_xfce_sysrc_directives is defined
      - setup_xfce_pixbuf_update_path is defined
      - setup_xfce_mime_db_path is defined
      - setup_xfce_mime_data_path is defined
    fail_msg: >
      "Make sure the following variables are defined ( setup_xfce_gui_users,
      setup_xfce_pkgs, setup_xfce_svcs, setup_xfce_sysrc_directives 
      setup_xfce_pixbuf_update_path, setup_xfce_mime_db_path 
      setup_xfce_mime_data_path"
